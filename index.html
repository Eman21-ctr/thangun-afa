<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/images/logo-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description"
    content="Aplikasi Manajemen Kelompok Tani Thangun Afa Besmarak - Memberdayakan petani lokal melalui teknologi." />
  <meta name="theme-color" content="#2D4F1E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/images/logo-icon.png" />

  <!-- Google Fonts - Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <title>Thangun Afa Besmarak</title>

  <style>
    /* Fallback font loading */
    * {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- Google Translate -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'id',
        includedLanguages: 'en',
        autoDisplay: false
      }, 'google_translate_element');
    }

    function switchToEnglish() {
      // Set cookie and reload to trigger translation
      document.cookie = 'googtrans=/id/en; path=/; domain=' + window.location.hostname;
      document.cookie = 'googtrans=/id/en; path=/';
      window.location.reload();
    }

    function switchToIndonesian() {
      // Clear the translation cookie
      document.cookie = 'googtrans=; path=/; domain=' + window.location.hostname + '; expires=Thu, 01 Jan 1970 00:00:00 GMT';
      document.cookie = 'googtrans=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
      window.location.reload();
    }

    function toggleLanguage() {
      var currentLang = document.cookie.match(/googtrans=\/id\/en/);
      if (currentLang) {
        switchToIndonesian();
      } else {
        switchToEnglish();
      }
    }

    function isEnglishActive() {
      return document.cookie.indexOf('googtrans=/id/en') !== -1;
    }
  </script>
  <script type="text/javascript"
    src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>

</html>
